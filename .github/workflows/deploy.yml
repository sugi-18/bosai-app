# .github/workflows/deploy.yml
#
# main ブランチに push するたびに、自動でビルドして GitHub Pages に公開します。
# 事前に必要な設定は2つ：
#   1. Settings → Pages → Source を「GitHub Actions」にする
#   2. Settings → Secrets and variables → Actions に
#      VITE_SUPABASE_URL と VITE_SUPABASE_ANON_KEY を登録する

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # Actions タブから手動実行もできる

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存パッケージをインストール
        run: npm ci

      - name: ビルド
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Pages の設定を読み込む
        uses: actions/configure-pages@v5

      - name: 成果物をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 公開
        id: deployment
        uses: actions/deploy-pages@v4
